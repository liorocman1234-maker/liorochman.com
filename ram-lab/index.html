<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מעבדת תופעות ומחלות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
/* Layout: one narrow study column, a "case card" at the center like a clinic intake sheet; chakra colors mark the 7 centers */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16232B; --muted:#5B6B72; --line:#D9E0DE;
  --accent:#1F5F5B; --accent-ink:#FFFFFF; --soft:#E3EEEC;
  --good:#2E7D4F; --good-bg:#E2F2E8; --bad:#B23A3A; --bad-bg:#F8E3E1; --mid:#9A6A00; --mid-bg:#F7EDD5;
  --c1:#C0392B; --c2:#E67E22; --c3:#D4AC0D; --c4:#27AE60; --c5:#2E86C1; --c6:#5B3FA8; --c7:#8E44AD;
  --display:"Frank Ruhl Libre", "David", Georgia, serif;
  --body:"Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172225; --ink:#E6EEEC; --muted:#93A5A8; --line:#2A3A3D;
  --accent:#5FB3A9; --accent-ink:#0F1719; --soft:#1E3133;
  --good:#6FCF97; --good-bg:#183326; --bad:#F08A80; --bad-bg:#3A1F1E; --mid:#E8C46A; --mid-bg:#352B14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --ink:#E6EEEC; --muted:#93A5A8; --line:#2A3A3D;
  --accent:#5FB3A9; --accent-ink:#0F1719; --soft:#1E3133;
  --good:#6FCF97; --good-bg:#183326; --bad:#F08A80; --bad-bg:#3A1F1E; --mid:#E8C46A; --mid-bg:#352B14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2rem;font-weight:900}
h2{font-size:1.35rem;font-weight:700}
.sub{color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chakras{display:flex;gap:5px}
.chakras i{width:10px;height:10px;border-radius:50%;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;background:var(--dot)}
.focus{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.focus label{font-weight:700;font-size:.92rem}
.focus select{flex:1;min-width:0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:16px 20px;font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.primary small{font-weight:400;opacity:.85;font-size:.85rem}
.group-title{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:480px){.modes{grid-template-columns:1fr}}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:1.02rem}
.mode span{font-size:.88rem;color:var(--muted)}
.mode.wide{grid-column:1/-1;border:1.5px solid var(--accent);background:var(--soft)}
.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
select,input[type=search],textarea{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5;padding:10px}
.save{font-size:.8rem;color:var(--muted)}
.sesshead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.prog{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--ink);letter-spacing:0}
.pill i{width:8px;height:8px;border-radius:50%;display:block}
.pill.out{background:none;border:1px solid var(--line);color:var(--muted);font-weight:600}
.prompt{font-family:var(--display);font-size:1.35rem;font-weight:500;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.prompt.name{font-size:1.9rem;font-weight:900}
.hint{font-size:.92rem;color:var(--muted);white-space:pre-line;border-top:1px dashed var(--line);padding-top:10px}
.hint b{color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;text-align:start;font-size:1rem;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.centers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.centers .opt{text-align:center;padding:12px 0;font-family:var(--display);font-size:1.3rem;font-weight:700;border-top:4px solid var(--cc)}
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stages .opt{text-align:center;font-weight:700;font-size:1.05rem}
.patient{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.patient li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--display);font-size:1.2rem;font-weight:700;overflow-wrap:anywhere;min-width:0}
.reveal{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;white-space:pre-line;overflow-wrap:anywhere}
.reveal.ok{background:var(--good-bg)}
.reveal.no{background:var(--bad-bg)}
.reveal.mid{background:var(--mid-bg)}
.reveal.plain{background:var(--soft)}
.reveal h3{margin:0;font-family:var(--display);font-size:1.15rem}
.reveal .lbl{font-size:.78rem;font-weight:700;color:var(--muted)}
.reveal .q{font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > button{flex:1;min-width:120px}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;font-weight:700}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.g{border-color:var(--good);color:var(--good)}
.btn.r{border-color:var(--bad);color:var(--bad)}
.btn.m{border-color:var(--mid);color:var(--mid)}
.btn:disabled{opacity:.55;cursor:default}
.done{text-align:center;align-items:center}
.done .big{font-family:var(--display);font-size:3rem;font-weight:900;line-height:1}
.list{display:flex;flex-direction:column;gap:8px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;white-space:pre-line;overflow-wrap:anywhere;min-width:0}
.entry .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.entry b{font-size:1.05rem}
.entry p{margin:0;font-size:.95rem}
.entry .s{color:var(--muted);font-size:.88rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;white-space:normal}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
details.fam{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
details.fam summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fam summary::-webkit-details-marker{display:none}
details.fam summary b{font-family:var(--display);font-size:1.15rem}
details.fam summary span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;flex:none}
details.fam[open] summary{border-bottom:1px solid var(--line)}
.fam-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fam-body .askq{background:var(--soft);border-radius:8px;padding:10px 12px}
.sysgroup{display:flex;flex-direction:column;gap:4px}
.sysgroup h4{margin:0;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.92rem}
.names button[aria-expanded="true"]{border-color:var(--accent);background:var(--soft)}
.peek{font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 12px;white-space:pre-line;overflow-wrap:anywhere}
.fb{font-size:.95rem}
.what{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>

function hash(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'k'+(h>>>0).toString(36)}
const seen=new Set();
DATA.forEach(e=>{let k=e.id||hash(e.n+'|'+e.c.slice(0,40));while(seen.has(k))k+='x';seen.add(k);e.id=k;
  // every center the doc names for this entry ("1 ו-4", "מרכזים 4 ו-6", "חלק מהפנים שייכים למרכז 6")
  const kk=e.k||'';
  e.centers=/^\s*[1-7]|מרכז/.test(kk)?[...new Set((kk.match(/[1-7]/g)||[]).map(Number))]:[];
  if(/שש/.test(kk)&&/מרכז/.test(kk))e.centers.push(6);if(/שבע/.test(kk)&&/מרכז/.test(kk))e.centers.push(7);
  e.centers=[...new Set(e.centers)];
  e.center=e.centers[0]||0;

/* ---------- topics: two entries about the same organ or theme never meet in one session ---------- */
const GENERIC=new Set(['דלקת','מחלה','מחלת','סרטן','תסמונת','כאב','כאבי','פגיעה','בלוטת','בלוטות','מערכת','הפרעה','הפרעת','יתר','של','עם','או','מלידה','כללי','כללית']);
const words=n=>n.replace(/[()\-–\/,.:#*A-Za-z0-9’']/g,' ').split(/\s+/).filter(w=>w.length>=2);
DATA.forEach(e=>{
  const ws=words(e.n);
  // strip a one-letter prefix (ב, ל, מ, ה, ו, כ, ש) from longer words, so "באשכים" and "אשכים" are the same topic
  // each word adds its stem with and without that prefix, so a match on either counts
  e.topics=new Set(ws.filter(w=>w.length>=3&&!GENERIC.has(w)).flatMap(w=>[w.slice(0,3),w.replace(/^[בלמהוכש](?=...)/,'').slice(0,3)]));
  if(e.tp)e.topics.add('@'+e.tp);
  if(ws[0]&&!GENERIC.has(ws[0]))e.topics.add('#'+ws[0]); // הזעת יתר..., פחד מ..., השמנת יתר...
  // a variant that works as a multiple-choice prompt: a real crisis, short enough to read
  e.mc=e.v.filter(c=>c.length>=8&&c.length<=320);
  e.ok=!!e.f&&e.mc.length>0&&!e.nomc;
});
function clash(a,b){if(a===b||a.n===b.n)return true;for(const t of a.topics)if(b.topics.has(t))return true;return false}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

function mergeP(a,b){
  if(!a)return b; if(!b)return a;
  const out={...a,...b,items:{...a.items},days:{...a.days}};
  for(const[k,v]of Object.entries(b.items||{})){const o=out.items[k];if(!o||(v.r+v.w)>(o.r+o.w))out.items[k]=v}
  for(const[k,v]of Object.entries(b.days||{}))out.days[k]=Math.max(out.days[k]||0,v);
  const ca=a.cases||{r:0,w:0},cb=b.cases||{r:0,w:0};
  out.cases=(ca.r+ca.w)>(cb.r+cb.w)?ca:cb;
  out.perDay=b.perDay||a.perDay||10; out.sys=b.sys||a.sys||'auto';
  return out;
}

/* ---------- focus: which body systems ---------- */
function planNow(){const t=today();let cur=PLAN[0];for(const p of PLAN)if(p[0]<=t)cur=p;return cur}
function activeSys(){
  if(P.sys==='all')return null;
  if(P.sys==='auto'){const p=planNow();return p[1].length?p[1]:null}
  return [P.sys];

/* ---------- scheduling ---------- */
const it=id=>P.items[id];
function stats(){
  const t=today();let learned=0,mastered=0,due=0;
  for(const e of DATA){const s=it(e.id);if(!s)continue;learned++;if(s.b>=MASTER)mastered++;if(s.d<=t)due++}
  let streak=0,d=t;if(!P.days[d])d=addDays(d,-1);while(P.days[d]){streak++;d=addDays(d,-1)}
  const stM=STAGES.filter(s=>it(s.id)&&it(s.id).b>=MASTER).length;
  return{learned,mastered,due,streak,fresh:DATA.length-learned,newToday:P.newDay===t?(P.newCount||0):0,stM};
}
// picks a varied session: no shared topic, at most 2 per crisis family, at most 3 per body system (unless a system is in focus)
function varied(cands,cap,{fam=2,sys=3}={}){
  const out=[],fc={},sc={};
  for(const pass of [0,1]){ // second pass relaxes the family and system caps, never the topic rule
    for(const e of cands){
      if(out.length>=cap)break;
      if(out.includes(e)||out.some(o=>e.topics&&clash(o,e)))continue;
      if(!pass&&e.f&&(fc[e.f]||0)>=fam)continue;
      if(!pass&&e.y&&(sc[e.y]||0)>=sys)continue;
      out.push(e);if(e.f)fc[e.f]=(fc[e.f]||0)+1;if(e.y)sc[e.y]=(sc[e.y]||0)+1;
    }
  }
  return out;
}
// duePool: what is due for review (always every system, so nothing learned is forgotten); pool: where new cards come from
function deck(pool,newCap,dueCap=25,duePool=pool){
  const t=today(),focused=!!activeSys()&&pool!==STAGES;
  const capSys=focused?99:3;
  const due=duePool.filter(e=>it(e.id)&&it(e.id).d<=t).sort((a,b)=>it(a.id).d<it(b.id).d?-1:1);
  let q=varied(due,dueCap,{sys:capSys});
  let fresh=varied(shuffle(pool.filter(e=>!it(e.id)&&!q.some(o=>e.topics&&clash(o,e)))),newCap,{sys:capSys});
  // the month's system ran out of new cards: top up from all systems
  if(fresh.length<newCap&&pool!==STAGES&&duePool!==pool){
    const more=varied(shuffle(duePool.filter(e=>!it(e.id)&&!fresh.includes(e)&&!q.concat(fresh).some(o=>clash(o,e)))),newCap-fresh.length);
    fresh=fresh.concat(more);
  }
  q=q.concat(fresh);
  if(q.length<6){
    const weak=pool.filter(e=>it(e.id)&&!q.includes(e)&&!q.some(o=>e.topics&&clash(o,e))).sort((a,b)=>it(a.id).b-it(b.id).b||Math.random()-.5);
    q=q.concat(varied(weak,6-q.length,{sys:capSys}));
  }
  if(q.length<6)q=q.concat(varied(shuffle(pool.filter(e=>!q.includes(e)&&!q.some(o=>e.topics&&clash(o,e)))),6-q.length,{sys:capSys}));
  // spread: avoid two items of the same family or system back to back
  const s=shuffle(q),res=[];
  while(s.length){const last=res[res.length-1];let i=s.findIndex(e=>!last||(e.f!==last.f&&e.y!==last.y));if(i<0)i=0;res.push(s.splice(i,1)[0])}
  return res;
}
// when reviews pile up, new cards slow down until the backlog clears
function newRoom(st){
  const base=Math.max(0,P.perDay-st.newToday);
  if(st.due>60)return 0;
  if(st.due>30)return Math.ceil(base/2);
  return base;
}
function buildQueue(kind){
  const st=stats(), room=newRoom(st);
  if(kind==='stage')return deck(STAGES,8).map(e=>({e,mode:'stage'}));
  if(kind==='case')return Array.from({length:6},()=>({mode:'case'}));
  let pool=DATA.filter(inFocus);
  if(pool.length<8)pool=DATA;
  if(kind==='center'){pool=pool.filter(e=>e.center);if(pool.length<8)pool=DATA.filter(e=>e.center)}
  if(kind==='toName'||kind==='toCause'){pool=pool.filter(e=>e.ok);if(pool.length<8)pool=DATA.filter(e=>e.ok)}
  let duePool=DATA;
  if(kind==='center')duePool=DATA.filter(e=>e.center);
  if(kind==='toName'||kind==='toCause')duePool=DATA.filter(e=>e.ok);
  const q=deck(pool,kind==='center'?Math.min(10,room):room,kind==='explain'?8:25,duePool).map(e=>({e,mode:kind==='mix'?pickMode(e):kind}));
  if(kind==='explain')return q.slice(0,8);
  if(kind==='mix'&&q.length>=6){q.splice(Math.floor(q.length/2),0,{mode:'case'});q.push({mode:'case'})}
  return q;
}
function pickMode(e){
  if(!e.ok)return e.center?'center':'flash'; // long or vague entries are not fair as multiple choice
  const r=Math.random();
  if(e.center&&r<.2)return'center';
  return r<.62?'toName':'toCause';
}
function grade(e,res){ // res: true | false | 'mid'
  const t=today();let s=it(e.id);
  if(!s){s={b:0,d:t,r:0,w:0};P.items[e.id]=s;if(DATA.includes(e)){if(P.newDay!==t){P.newDay=t;P.newCount=0}P.newCount++}}
  if(res===true){s.b=Math.min(s.b+1,IV.length-1);s.r++;s.d=addDays(t,IV[s.b])}
  else if(res==='mid'){s.b=Math.max(1,s.b);s.d=addDays(t,1);s.r++}
  else{s.b=Math.max(1,s.b-2);s.w++;s.d=addDays(t,1)}
  P.days[t]=(P.days[t]||0)+1;
  scheduleSave();
}

/* ---------- question building ---------- */
// words that appear in names but carry the crisis itself; hiding them would empty the question
const KEEP=new Set(['פחד','חוסר','משבר','השמנת','הזעת','אלרגיה','התמכרות','זכרית','נקבית','זכרי','נקבי','אנרגיה','נשירת','קרום']);
// hides every form of the name inside the text: exact words, the same root with prefixes or endings, and Latin names
function maskName(text,name){
  const stems=[];
  // the doc sometimes glues Hebrew and Latin together ("התריסparathyroid"), so split them first
  for(const w of name.replace(/([A-Za-z])([֐-׿])|([֐-׿])([A-Za-z])/g,'$1$3 $2$4').split(/[\s\-–\/(),.:'"״’]+/)){
    if(/[A-Za-z]/.test(w)){const l=w.replace(/[^A-Za-z]/g,'');if(l.length>=3)stems.push({lat:l.toLowerCase()});continue}
    if(GENERIC.has(w)||KEEP.has(w))continue;
    const c=w.replace(/^ה(?=...)/,'');
    if(c.length<3)continue;
    stems.push({s:c.slice(0,Math.min(4,c.length))});
  }
  // tokens are split on spaces and on '#', and words glued without a space are caught by searching inside the token
  return text.split(/([\s#]+)/).map(tok=>{
    if(/^[\s#]*$/.test(tok))return tok;
    const heb=tok.replace(/[^֐-׿]/g,'');
    for(const st of stems){
      if(st.lat){if(tok.toLowerCase().includes(st.lat))return '▁▁▁';continue}
      if(st.s.length>=4){if(heb.includes(st.s))return '▁▁▁';continue}
      for(let k=0;k<=2;k++)if(heb.slice(k).startsWith(st.s)&&/^[ובלהמשכ]*$/.test(heb.slice(0,k)))return '▁▁▁';
    }
    return tok;
  }).join('');
}
// wrong options: plausible (same body system first) but never defensible (other crisis family, other topic, other text)
function distractors(e,n){
  const fair=x=>x!==e&&x.ok&&x.f&&x.f!==e.f&&!clash(x,e)&&x.c!==e.c;
  const tiers=[DATA.filter(x=>fair(x)&&x.y===e.y),DATA.filter(x=>fair(x)&&e.center&&x.center===e.center),DATA.filter(fair)];
  const out=[];
  for(const tier of tiers)for(const x of shuffle([...tier])){
    if(out.length>=n)break;
    if(out.includes(x)||out.some(o=>clash(o,x)||o.f===x.f))continue;
    out.push(x);
  }
  return out;
}
const shortest=e=>e.mc.length?e.mc.reduce((a,b)=>a.length<=b.length?a:b):e.c;
function makeQ(mode,e){
  e=e||pick(DATA.filter(x=>x.ok));
  if(!e.ok)return null;
  const ds=distractors(e,3);
  if(mode==='toName'){
    const raw=pick(e.mc);
    return{e,ds,prompt:maskName(raw,e.n),hint:e.s&&e.s.length<=160?maskName(e.s,e.n):''};
  }
  return{e,ds,optText:x=>maskName(shortest(x),x.n)};
}
// a case uses only cards whose text in the doc names the crisis outright, described as the patient's complaint (e.cp)
function pickThree(pool){
  const chosen=[],ys=new Set();
  for(const e of pool){if(chosen.length>=3)break;if(ys.has(e.y)||chosen.some(o=>clash(o,e)))continue;chosen.push(e);ys.add(e.y)}
  for(const e of pool){if(chosen.length>=3)break;if(!chosen.includes(e)&&!chosen.some(o=>clash(o,e)))chosen.push(e)}
  return chosen;
}
function makeCase(){
  const g=pick(['F','M']);
  const fits=e=>e.cp&&(!e.g||e.g===g);
  const focus=activeSys();
  // try families in random order (focus first) until one gives three complaints on different topics
  const fams=shuffle(Object.keys(FAM).filter(f=>f!=='VIT'));
  const order=focus?fams.filter(f=>DATA.some(e=>e.f===f&&fits(e)&&focus.includes(e.y))).concat(fams):fams;
  let f,chosen=[];
  for(const x of order){chosen=pickThree(shuffle(DATA.filter(e=>e.f===x&&fits(e))));if(chosen.length===3){f=x;break}}
  const others=Object.keys(FAM).filter(x=>x!==f&&x!=='VIT'&&DATA.some(e=>e.f===x&&e.cp));
  const opts=shuffle([f,...shuffle(others).slice(0,3)]);
  return{f,entries:chosen,opts,g,age:24+(Math.random()*40|0)};
}

function start(kind){
  let q=buildQueue(kind==='flash'?'mix':kind);
  if(kind==='flash')q=q.filter(x=>x.e).map(x=>({...x,mode:'flash'}));
  S={kind,q,i:0,ok:0,total:q.length,answered:false,wrongs:[]};
  view='session';render();window.scrollTo({top:0});
}
function sessionHead(){
  const p=S.total?Math.min(100,S.i/S.total*100):0;
  return `<div class="sesshead"><button class="link" id="back">→ חזרה</button><div class="prog"><i style="width:${p}%"></i></div><span class="save">${Math.min(S.i+1,S.total)}/${S.total}</span></div>`;
}
function pillFor(e){return e.center?`<span class="pill"><i style="background:${CC[e.center]}"></i>מרכז ${e.center}</span>`:''}

function session(){
  if(S.i>=S.q.length)return finish();
  const cur=S.q[S.i],{e,mode}=cur;
  let body='';
  if(mode==='toName'){
    const q=cur.q||(cur.q=makeQ('toName',e));
    const opts=cur.opts||(cur.opts=shuffle([e,...q.ds]));S.opts=opts;
    body=`<div class="kicker">מה המחלה? ${pillFor(e)}</div>
    <div class="prompt">${esc(q.prompt)}</div>
    ${q.hint?`<div class="hint"><b>סימפטום: </b>${esc(q.hint)}</div>`:''}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.n)}</button>`).join('')}</div>`;
  }else if(mode==='toCause'){
    const q=cur.q||(cur.q=makeQ('toCause',e));
    const opts=cur.opts||(cur.opts=shuffle([e,...q.ds]));S.opts=opts;
    body=`<div class="kicker">מה המשבר שמאחורי</div><div class="prompt name">${esc(e.n)}</div>${whatIs(e)}
    <div class="opts">${opts.map((o,i)=>`<button class="opt clamp" data-i="${i}">${esc(q.optText(o))}</button>`).join('')}</div>`;
  }else if(mode==='center'){
    body=`<div class="kicker">לאיזה מרכז שייך${e.centers.length>1?' (יש יותר מתשובה אחת, מספיק לבחור אחת)':''}</div><div class="prompt name">${esc(e.n)}</div>${whatIs(e)}
    <div class="centers">${[1,2,3,4,5,6,7].map(i=>`<button class="opt" style="--cc:${CC[i]}" data-c="${i}" title="${CNAME[i]}">${i}</button>`).join('')}</div>`;
  }else if(mode==='stage'){
    body=`<div class="kicker">באיזה שלב החסימה</div><div class="prompt name">${esc(e.n)}</div>
    <div class="stages">${STN.map((n,i)=>`<button class="opt" data-s="${i}">${n}</button>`).join('')}</div>`;
  }else if(mode==='case'){
    if(!cur.c)cur.c=makeCase();
    const c=cur.c;
    const F=c.g==='F';
    body=`<div class="kicker">מקרה קליני</div>
    <div class="prompt">${F?'מטופלת':'מטופל'} ${F?'בת':'בן'} ${c.age} ${F?'מגיעה':'מגיע'} לקליניקה ו${F?'מספרת':'מספר'} על שלוש תלונות:</div>
    <ul class="patient">${c.entries.map(x=>`<li><span>${esc(x.cp)}</span></li>`).join('')}</ul>
    <p class="sub">לפי המסמך, איזה משבר אחד יכול לעמוד מאחורי שלושתן?</p>
    <div class="opts">${c.opts.map((f,i)=>`<button class="opt" data-f="${f}">${esc(FAM[f].n)}</button>`).join('')}</div>`;
  }else if(mode==='explain'){
    body=`<div class="kicker">במילים שלי ${pillFor(e)}</div><div class="prompt name">${esc(e.n)}</div>${whatIs(e)}
    <label class="sub" for="mine">מה המשבר שמאחורי, ומה השיעור? כתבו כמו שהייתם מסבירים למטופל.</label>
    <textarea id="mine" placeholder="למשל: זה קשור ל..."></textarea>
    <div class="row"><button class="btn" id="showAns">הצג תשובה בלי משוב</button><button class="btn go" id="check">בדוק עם Claude</button></div>
    <div id="fb" class="fb" aria-live="polite"></div>`;
  }else{
    body=`<div class="kicker">כרטיסייה ${pillFor(e)}</div><div class="prompt name">${esc(e.n)}</div>${whatIs(e)}
    <p class="sub">מה המשבר? מה השיעור? אמרו לעצמכם בקול, ואז הפכו את הכרטיס.</p>
    <div id="flip"><button class="btn go" style="width:100%" id="flipbtn">הפוך כרטיס</button></div>`;
  }
  if(cur.again)body=`<span class="pill out" style="align-self:flex-start">סבב תיקון: טעית בזה קודם</span>`+body;
  app.innerHTML=sessionHead()+`<div class="card pop">${body}<div id="after"></div></div>`;
  document.getElementById('back').onclick=()=>{view='home';render()};

  if(mode==='stage')app.querySelectorAll('.stages .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.s===e.st,b));
  if(mode==='case')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerCase(b));

    document.getElementById('flip').innerHTML=revealHTML(e,null)+selfGrade();
    wireSelfGrade(e);

function selfGrade(){return `<div class="row" style="margin-top:10px"><button class="btn r" id="f0">לא ידעתי</button><button class="btn m" id="fm">חלקית</button><button class="btn g" id="f1">ידעתי</button></div>`}

function requeue(e){
  const cur=S.q[S.i];
  if(!S.wrongs.includes(e))S.wrongs.push(e);

function answer(ok,btn){

function wireExplain(e){
  const ta=document.getElementById('mine'),fb=document.getElementById('fb'),chk=document.getElementById('check'),sh=document.getElementById('showAns');
  getSampler().then(s=>{if(s===null){chk.hidden=true;sh.textContent='הצג תשובה';sh.classList.add('go')}});

    const prompt=`אתה בודק תרגול של סטודנט לטיפול פסיכוסומטי, לפי מסמך התופעות והמחלות של המכללה שלו.
המחלה או התופעה: ${e.n}
מה המסמך אומר (משבר ושיעור): ${e.c}
${e.k?`צ'אקרה ומרידיאן לפי המסמך: ${e.k}`:''}
${e.s?`סימפטום לפי המסמך: ${e.s}`:''}
מה הסטודנט כתב: ${txt}

השווה רק למה שכתוב במסמך. אל תוסיף ידע רפואי או פסיכוסומטי מבחוץ, ואל תתקן את המסמך.
ציון: 2 אם תפס את המשבר המרכזי, 1 אם תפס חלק, 0 אם פספס.
כתוב בעברית פשוטה וחמה, בגוף שני, בלי מקפים ארוכים. כל שדה משפט אחד קצר.
החזר JSON בלבד: {"score":0,"good":"מה מדויק בתשובה שלו","missing":"מה חסר או לא מדויק"}`;
    try{
      const r=await s.json(prompt,{modelTier:'quick',cache:false});
      const sc=Math.max(0,Math.min(2,Number(r.score)||0));
      const res=sc===2?true:sc===1?'mid':false;
      S.answered=true;grade(e,res);if(res===true)S.ok++;if(res===false)requeue(e);
      fb.innerHTML='';
      showAfter(`<div class="reveal ${sc===2?'ok':sc===1?'mid':'no'}"><span class="lbl">משוב · ${sc===2?'מדויק':sc===1?'חלקי':'לא הפעם'}</span>
        ${r.good?`<div><b>מה מדויק:</b> ${esc(r.good)}</div>`:''}${r.missing?`<div><b>מה חסר:</b> ${esc(r.missing)}</div>`:''}</div>`+revealHTML(e,null));
    }catch(err){
      chk.disabled=false;sh.disabled=false;
      fb.textContent=err&&err.code==='rate_limited'?'יותר מדי בקשות ברצף. חכה דקה ונסה שוב, או הצג תשובה.':
        err&&err.code==='not_granted'?'לא ניתנה הרשאה ל־Claude. אפשר להציג תשובה ולדרג לבד.':'המשוב לא הגיע הפעם. נסה שוב או הצג תשובה.';
      if(err&&err.code==='not_granted')chk.hidden=true;
    }
  };
}
function next(){S.i++;S.total=Math.max(S.total,S.q.length);render();window.scrollTo({top:0})}
function finish(){
  const st=stats();const uniq=[...new Map(S.wrongs.map(e=>[e.id,e])).values()];
  app.innerHTML=`<div class="card done pop">${chakraDots()}<div class="big">${S.ok}/${S.i}</div>
  <h2>האימון הסתיים</h2><p class="sub">שולטים עכשיו ב־${st.mastered} מתוך ${DATA.length}. ${st.streak} ימים ברצף.</p>
  ${uniq.length?`<div style="text-align:start;width:100%"><span class="kicker">לחזור עליהם מחר</span><div class="list" style="margin-top:8px">${uniq.map(e=>`<div class="entry"><b>${esc(e.n)}</b><p>${esc(e.c?(e.c.slice(0,160)+(e.c.length>160?'…':'')):'שלב ה'+STN[e.st])}</p></div>`).join('')}</div></div>`:''}
  <div class="row" style="width:100%"><button class="btn" id="hm">לדף הבית</button><button class="btn go" id="more">עוד סבב</button></div></div>`;
  document.getElementById('hm').onclick=()=>{view='home';render()};
  document.getElementById('more').onclick=()=>start(S.kind);
}

function families(){
  const fams=Object.keys(FAM).map(f=>({f,list:DATA.filter(e=>e.f===f)})).sort((a,b)=>b.list.length-a.list.length);
  app.innerHTML=`<div class="sesshead"><button class="link" id="back">→ חזרה</button></div>
  <h2>משפחות משבר</h2>
  <p class="sub">כל משבר מופיע באיברים שונים. פותחים משפחה, רואים את כל המחלות שלה לפי מערכת, ולוחצים על מחלה כדי לראות מה המסמך אומר.</p>
  <div class="list">${fams.map(({f,list})=>{
    const by={};list.forEach(e=>(by[e.y]=by[e.y]||[]).push(e));
    return `<details class="fam"><summary><b>${esc(FAM[f].n)}</b><span>${list.length} רשומות</span></summary>
    <div class="fam-body"><p class="sub" style="color:var(--ink)">${esc(FAM[f].d)}</p>
    <div class="askq"><b>שאלה למטופל:</b> ${esc(FAM[f].q)}</div>
    ${Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([y,es])=>`<div class="sysgroup"><h4>${esc(SYS[y])}</h4><div class="names">${es.map(e=>`<button data-id="${e.id}" aria-expanded="false">${esc(e.n)}</button>`).join('')}</div></div>`).join('')}
    <div class="peek" hidden></div></div></details>`}).join('')}</div>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  app.querySelectorAll('.names button').forEach(b=>b.onclick=()=>{
    const body=b.closest('.fam-body'),peek=body.querySelector('.peek'),open=b.getAttribute('aria-expanded')==='true';
    body.querySelectorAll('.names button').forEach(x=>x.setAttribute('aria-expanded','false'));
    if(open){peek.hidden=true;return}
    const e=DATA.find(x=>x.id===b.dataset.id);b.setAttribute('aria-expanded','true');
    peek.innerHTML=`<b>${esc(e.n)}</b>${e.k?` · ${esc(e.k)}`:''}\n${e.x?`<span style="color:var(--muted)">${esc(e.x)}</span>\n`:''}${esc(e.c)}`;peek.hidden=false;
  });
}

function index(){
  app.innerHTML=`<div class="sesshead"><button class="link" id="back">→ חזרה</button></div>
  <h2>אינדקס</h2><input type="search" id="q" placeholder="חיפוש: מחלה, איבר, מילה מהמשבר (למשל: אובדן, טריטוריה, כליות)" value="${esc(Q)}" style="width:100%">
  <div class="list" id="list"></div>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  const q=document.getElementById('q');q.oninput=()=>{Q=q.value;paintList()};paintList();
}
function paintList(){
  const q=Q.trim();
  const rows=(q?DATA.filter(e=>(e.n+' '+e.c+' '+e.s+' '+(e.x||'')+' '+e.k+' '+(SYS[e.y]||'')+' '+(e.f?FAM[e.f].n:'')).includes(q)):DATA).slice(0,120);
  document.getElementById('list').innerHTML=rows.map(e=>{const s=it(e.id),b=s?s.b:0;
    return `<div class="entry"><div class="h"><b>${esc(e.n)}</b><div class="dots" title="רמת שליטה">${[1,2,3,4,5,6].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</div></div>
    <div class="tags">${tagPills(e)}</div>
    ${e.x?`<span class="s">${esc(e.x)}</span>`:''}
    ${e.k?`<span class="s">${esc(e.k)}</span>`:''}<p>${esc(e.c)}</p>${e.s?`<span class="s">סימפטום: ${esc(e.s)}</span>`:''}</div>`}).join('')
    +(rows.length===120?'<p class="sub">מוצגות 120 הראשונות. חפש כדי לצמצם.</p>':'')
    +(!rows.length?'<p class="sub">לא נמצא. נסה מילה אחרת.</p>':'');
}

function render(){({home,session,index,families})[view]()}

/* ---------- class version: progress lives in this browser, with a backup code to move between devices ---------- */
async function initStore(){
  const local=loadLocal(); if(local)P=mergeP(P,local);
  P.cases=P.cases||{r:0,w:0}; P.sys=P.sys||'auto';
  saveState='נשמר במכשיר הזה';
  if(view==='home')render();
}
async function getSampler(){return null}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gz(str,dir){
  const cs=dir==='in'?new CompressionStream('gzip'):new DecompressionStream('gzip');
  const data=dir==='in'?new TextEncoder().encode(str):str;
  const buf=await new Response(new Blob([data]).stream().pipeThrough(cs)).arrayBuffer();
  return dir==='in'?new Uint8Array(buf):new TextDecoder().decode(buf);
}
async function makeBackup(){
  const compact={v:1,i:Object.fromEntries(Object.entries(P.items).map(([k,s])=>[k,[s.b,s.d,s.r,s.w]])),days:P.days,perDay:P.perDay,sys:P.sys,cases:P.cases,newDay:P.newDay,newCount:P.newCount};
  const json=JSON.stringify(compact);
  try{if(window.CompressionStream)return 'L1'+b64(await gz(json,'in'))}catch(e){}
  return 'L0'+b64(new TextEncoder().encode(json));
}
async function readBackup(code){
  code=code.replace(/\s+/g,'');
  const kind=code.slice(0,2),body=code.slice(2);
  let json;
  if(kind==='L1')json=await gz(unb64(body),'out');
  else if(kind==='L0')json=new TextDecoder().decode(unb64(body));
  else throw new Error('bad');
  const c=JSON.parse(json);
  return{v:2,items:Object.fromEntries(Object.entries(c.i||{}).map(([k,a])=>[k,{b:a[0],d:a[1],r:a[2],w:a[3]}])),days:c.days||{},perDay:c.perDay||10,sys:c.sys||'auto',cases:c.cases||{r:0,w:0},newDay:c.newDay,newCount:c.newCount};
}
function daysSince(d){if(!d)return 999;return Math.round((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/864e5)}

const baseHome=home;
home=function(){
  baseHome();
  const st=stats();
  const due=st.learned>=10&&daysSince(P.lastBackup)>=7;
  const box=document.createElement('div');
  box.className='focus';box.style.flexDirection='column';box.style.alignItems='stretch';
  box.innerHTML=`${due?`<p style="margin:0"><b>שבוע בלי גיבוי.</b> שמרו קוד גיבוי בוואטסאפ או בפתקים, כדי לא לאבד את ההתקדמות אם תחליפו מכשיר או תנקו את הדפדפן.</p>`:`<p style="margin:0" class="sub">ההתקדמות נשמרת בדפדפן במכשיר הזה. כדי לעבור למכשיר אחר או לשמור עותק, השתמשו בקוד גיבוי.</p>`}
    <div class="row"><button class="btn${due?' go':''}" id="mkb">צור קוד גיבוי</button><button class="btn" id="rsb">שחזר מקוד</button></div>
    <div id="bk" hidden style="display:flex;flex-direction:column;gap:8px"></div>`;
  app.appendChild(box);
  const bk=box.querySelector('#bk');
  box.querySelector('#mkb').onclick=async()=>{
    const code=await makeBackup();
    bk.hidden=false;
    bk.innerHTML=`<label class="sub" for="bkcode">הקוד שלכם. העתיקו ושמרו אותו במקום בטוח:</label><textarea id="bkcode" readonly style="min-height:80px;direction:ltr;font-size:.8rem">${code}</textarea><button class="btn go" id="cpb">העתק</button><span class="sub" id="cpmsg" aria-live="polite"></span>`;
    const ta=bk.querySelector('#bkcode'),msg=bk.querySelector('#cpmsg');
    bk.querySelector('#cpb').onclick=()=>{
      navigator.clipboard.writeText(code).then(()=>{msg.textContent='הקוד הועתק.'}).catch(()=>{ta.focus();ta.select();msg.textContent='סמנו את הקוד והעתיקו ידנית.'});
      P.lastBackup=today();saveLocal();
    };
  };
  box.querySelector('#rsb').onclick=()=>{
    bk.hidden=false;
    bk.innerHTML=`<label class="sub" for="rscode">הדביקו כאן את קוד הגיבוי:</label><textarea id="rscode" style="min-height:80px;direction:ltr;font-size:.8rem"></textarea><button class="btn go" id="dors">שחזר</button><span class="sub" id="rsmsg" aria-live="polite"></span>`;
    bk.querySelector('#dors').onclick=async()=>{
      const msg=bk.querySelector('#rsmsg');
      try{
        const restored=await readBackup(bk.querySelector('#rscode').value);
        P=mergeP(P,restored);P.lastBackup=today();saveLocal();
        msg.textContent='ההתקדמות שוחזרה.';setTimeout(render,700);
      }catch(e){msg.textContent='הקוד לא תקין. ודאו שהעתקתם אותו במלואו ונסו שוב.'}
    };
  };
};

render();
initStore();
</script>
